name: App regression and security tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application module syntax
        run: |
          node --check assets/app.js
          node --check sw.js
          node --check assets/service-worker-registration.js
          node --check assets/app-gate.js
          node --check assets/account-security.js
          node --check assets/writing-security.js
          node --check assets/vault-crypto.js
          node --check assets/vault-session.js
          node --check assets/vault-sync.js
          node --check assets/vault-storage.js
          node --check assets/local-backup.js
          node --check worker.js
          node --check assets/garden.js
          node --check assets/settings-modal.js
          node --check assets/garden-model.js
          node --check assets/drive-sync.js
          node --check assets/gist-sync.js
          node --check assets/location-checkin.js
          node --check assets/voice-note-store.js
      - name: Run regression and security tests
        run: node --test tests/*.test.mjs
