name = "faith-focus-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

[[kv_namespaces]]
binding = "VAULT_PACKETS"
id = "REPLACE_WITH_VAULT_PACKETS_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "VAULT_COORDINATOR"
class_name = "VaultCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultCoordinator"]
